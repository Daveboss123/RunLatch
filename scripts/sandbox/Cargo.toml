[package]
name = "runlatch-sandbox-checks"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
description = "Loopback-only development checks for the compiled RunLatch contract"

[dependencies]
near-sandbox = "=0.4.0"
near-api = "=0.8.7"
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "time", "process"] }
# Already locked transitive crates; direct use is LOCAL RPC diagnosis only.
near-openapi-types = "=0.8.0"
reqwest = { version = "=0.12.28", features = ["json"] }
