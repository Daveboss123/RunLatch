[package]
name = "runlatch-contract"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
description = "Quote-bound spending controls for a NEAR testnet workflow"

[features]
# Deliberate LOCAL fault artifact only. Never use for public deployment.
# No method/argument can select this; default builds keep25TGas callbacks.
sandbox-callback-starvation = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0"

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
strip = true
